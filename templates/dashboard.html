<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Product Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Product Manager</span>

        <a href="{% url 'logout' %}" class="btn btn-danger">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2>Dashboard</h2>
    <p>Welcome, {{ request.user.username }}!</p>

    <div class="row mt-4">

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h5>Total Products</h5>
                <h2>{{ total_products }}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h5>Active Products</h5>
                <h2>{{ active_products }}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h5>Inactive Products</h5>
                <h2>{{ inactive_products }}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h5>Low Stock</h5>
                <h2>{{ low_stock_products }}</h2>
            </div>
        </div>

    </div>

    <div class="mt-5">
        <a href="{% url 'product_list' %}" class="btn btn-primary">
    Products
</a>

<a href="{% url 'product_create' %}" class="btn btn-success">
    Add Product
</a>
    </div>

</div>

</body>
</html>
